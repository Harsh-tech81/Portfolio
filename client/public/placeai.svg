<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="1080" cy="520" r="220" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  <circle cx="640" cy="360" r="140" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- Subtle Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Central Glassmorphism Card -->
  <rect x="140" y="80" width="1000" height="560" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Accent Top Border -->
  <path d="M 164 80 L 1116 80" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Header Badge -->
  <g transform="translate(200, 140)">
    <rect width="210" height="34" rx="17" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="1">AGENTIC AI PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Place<tspan fill="url(#accentGrad)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="200" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Production-Grade AI Campus Placement &amp; Recruitment Portal
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(200, 330)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="210" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">⚡ LangGraph Agents</text>

    <!-- Tag 2 -->
    <rect x="225" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="245" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">🎯 768d Qdrant Vectors</text>

    <!-- Tag 3 -->
    <rect x="460" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="480" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">🎙️ AI Mock Interview</text>

    <!-- Tag 4 -->
    <rect x="695" y="0" width="185" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="715" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">🔄 BullMQ &amp; Redis</text>
  </g>

  <!-- Visual Mockup Graphic Preview -->
  <g transform="translate(200, 410)">
    <!-- Sub-card 1: Candidate Semantic Match -->
    <rect x="0" y="0" width="425" height="180" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Semantic Match Dossier</text>
    <text x="25" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Multi-Agent Vector Alignment</text>
    
    <!-- Match Score Gauge -->
    <text x="25" y="125" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#38bdf8">94%</text>
    <text x="130" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">Strong Technical Match</text>
    <text x="130" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">GitHub signals &amp; PDF resume verified</text>

    <!-- Progress bar -->
    <rect x="25" y="150" width="375" height="8" rx="4" fill="#1e293b" />
    <rect x="25" y="150" width="352" height="8" rx="4" fill="url(#accentGrad)" />

    <!-- Sub-card 2: Adaptive Mock Interview -->
    <rect x="455" y="0" width="425" height="180" rx="16" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="480" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Live AI Mock Interview Room</text>
    <text x="480" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Real-Time Voice STT &amp; Rubric Grading (0-10)</text>

    <!-- Interview metrics -->
    <g transform="translate(480, 95)">
      <rect x="0" y="0" width="115" height="55" rx="8" fill="#1e293b" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Confidence</text>
      <text x="15" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a855f7">9.2 / 10</text>

      <rect x="130" y="0" width="115" height="55" rx="8" fill="#1e293b" />
      <text x="145" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Nuances</text>
      <text x="145" y="46" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">8.8 / 10</text>

      <rect x="260" y="0" width="115" height="55" rx="8" fill="#1e293b" />
      <text x="275" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Verdict</text>
      <text x="275" y="46" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#10b981">Shortlist</text>
    </g>
  </g>
</svg>
