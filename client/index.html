<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Harsh | Full Stack Developer Portfolio</title>
    <meta name="description" content="Harsh - Full Stack Developer specializing in MERN Stack, React.js, Node.js, and modern web technologies. View my projects, skills, and experience." />
    <meta name="keywords" content="Harsh, Full Stack Developer, MERN Stack, React, Node.js, Portfolio, Web Developer" />
    <meta name="author" content="Harsh" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harsh | Full Stack Developer Portfolio" />
    <meta property="og:description" content="Full Stack Developer specializing in MERN Stack, React.js, Node.js, and modern web technologies." />
    <meta property="og:url" content="https://harsh-portfolio.dev" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harsh | Full Stack Developer Portfolio" />
    <meta name="twitter:description" content="Full Stack Developer specializing in MERN Stack and modern web technologies." />
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0a0a" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Reset scroll and hash to Home on reload -->
    <script>
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname);
      }
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
